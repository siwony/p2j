1", "usage": "분류", "tracking": 0}}, "spacing": {"xs": 4, "sm": 8, "md": 12, "lg": 16, "xl": 24, "xxl": 32, "xxxl": 48, "screen": 24, "screenCompact": 16, "section": 32, "row": 16, "inline": 8, "modal": 24, "safeBottom": 16}, "radius": {"control": 8, "container": 16, "modal": 24}, "border": {"hairline": 0.5, "control": 1, "focus": 2}, "elevation": {"content": "none", "presentation": "system"}, "layout": {"referenceWidth": 390, "minimumWidth": 320, "compactBreakpoint": 350, "minimumTapTarget": 44, "safeArea": "system"}, "motion": {"quick": 180, "standard": 240, "sheet": 320, "reduced": 80, "easing": "cubic-bezier(0.2, 0, 0, 1)", "reduceMotion": "opacityOnly"}, "symbols": {"today": "sun.max", "week": "calendar", "library": "square.stack", "records": "text.book.closed", "settings": "gearshape", "start": "play.fill", "pause": "pause.fill", "complete": "checkmark", "add": "plus", "back": "chevron.left", "forward": "chevron.right", "more": "ellipsis", "timer": "timer", "notification": "bell", "calendarApplied": "calendar.badge.checkmark", "warning": "exclamationmark.circle", "retry": "arrow.clockwise", "external": "arrow.up.right", "close": "xmark"}, "format": "hanju.semantic-tokens.v1"}</script>
<script>
const TOKENS=JSON.parse(document.getElementById('design-tokens').textContent);
const screens=[['today','오늘'],['week','이번 주'],['library','루틴함'],['records','기록'],['settings','설정'],['editor','루틴 편집'],['reschedule','일정 옮기기'],['running','실행 중']];
const shapes={today:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',week:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h2m4 0h2m-8 4h2"/>',library:'<rect x="5" y="7" width="15" height="14" rx="2"/><path d="M3 17V4a1 1 0 0 1 1-1h13M9 12h7m-7 4h5"/>',records:'<path d="M5 3h13a2 2 0 0 1 2 2v16H6a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2Zm-2 15a3 3 0 0 1 3-3h14M8 7h7m-7 4h5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 3 3-1 2 3 3-2 1-3 3-1 1-4-3-2-1-3-4 1Z"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 4 4L19 6"/>',left:'<path d="m15 5-7 7 7 7"/>',right:'<path d="m9 5 7 7-7 7"/>',play:'<path d="m8 4 12 8-12 8Z"/>',pause:'<path d="M8 5v14M16 5v14"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${shapes[n]||shapes.right}</svg>`;
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({routines:[{id:'r1',name:'SQL 문제 두 개 풀기',category:'공부',duration:20,count:3,first:'문제집을 펼치고 첫 문제 읽기'},{id:'r2',name:'책상 정리',category:'집안일',duration:10,count:2,first:'책상 위 컵부터 치우기'},{id:'r3',name:'수건 세탁',category:'집안일',duration:15,count:1,first:'수건을 세탁기에 넣기'},{id:'r4',name:'가볍게 스트레칭',category:'생활',duration:10,count:3,first:'매트를 펴고 어깨 돌리기'}],items:[{id:'o1',rid:'r1',date:'2026-10-04',time:'20:00',status:'planned',elapsed:0},{id:'o2',rid:'r2',date:'2026-10-04',time:'',status:'planned',elapsed:0},{id:'o3',rid:'r3',date:'2026-10-04',time:'',status:'planned',elapsed:0},{id:'o4',rid:'r4',date:'2026-10-04',time:'',status:'completed',actual:480},{id:'o5',rid:'r1',date:'2026-10-01',time:'12:30',status:'completed',actual:1260,moved:true},{id:'o6',rid:'r2',date:'2026-10-02',time:'',status:'completed',actual:null}],memo:'점심시간에 잠깐 공부하니 시작하기 편했다.\n다음 주에도 짧게 해보기.',settings:{plan:true,execute:true,planTime:'20:00',executeTime:'09:00',calendar:false},calendarState:'unlinked'});
let data;try{data=JSON.parse(localStorage.getItem('hanju-design-v1'))||initial()}catch{data=initial()}
let screen=new URLSearchParams(location.search).get('screen')||'today';if(!screens.some(s=>s[0]===screen))screen='today';
let scenario='default',dark=false,big=false,weekOffset=0,selectedDay=6,selectedId='o1',sheet=null,editorId=null,filter='전체',draft={},toastTimer,memoTimer,sheetReturn=null,rescheduleReturn=null;
const save=()=>localStorage.setItem('hanju-design-v1',JSON.stringify(data));
const weekKey=()=>weekDates()[0];
const memoFor=key=>data.memos?.[key]??(key==='2026-09-28'?data.memo:'')??'';
const previousMemo=()=>{let d=dt(weekDates()[0]);d.setDate(d.getDate()-7);return memoFor(iso(d))};
const routine=i=>i.snapshot||data.routines.find(r=>r.id===i.rid)||{name:'보관한 루틴',category:'생활',duration:null,first:''};
const dt=s=>new Date(s+'T12:00:00');
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const weekDates=()=>Array.from({length:7},(_,i)=>{let d=dt('2026-09-28');d.setDate(d.getDate()+weekOffset*7+i);return iso(d)});
const dateLabel=d=>`${dt(d).getMonth()+1}월 ${dt(d).getDate()}일 ${['일','월','화','수','목','금','토'][dt(d).getDay()]}요일`;
const rangeLabel=()=>{let ds=weekDates();return `${dt(ds[0]).getMonth()+1}.${dt(ds[0]).getDate()} — ${dt(ds[6]).getMonth()+1}.${dt(ds[6]).getDate()}`};
const elapsed=i=>(i.elapsed||0)+(i.status==='running'&&i.started?Math.floor((Date.now()-i.started)/1000):0);
const timer=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
const duration=r=>r.duration?`예상 ${r.duration}분`:'예상 시간 미정';
const recordedTime=seconds=>seconds<60?'1분 미만':`${Math.floor(seconds/60)}분`;
const actual=i=>i.actual==null?'시간 미기록':`${recordedTime(i.actual)} 기록`;
const btn=(label,act,cls='quiet',extra='')=>`<button class="${cls}" data-action="${act}" ${extra}>${label}</button>`;
const heading=(title,sub='',action='')=>`<header class="heading"><div>${sub?`<p class="caption">${sub}</p>`:''}<h1>${title}</h1></div>${action}</header>`;
const empty=(title,body,action)=>`<div class="empty"><h2>${title}</h2><p class="secondary">${body}</p>${action||''}</div>`;
const errorNotice=(msg='변경 내용을 저장하지 못했어요.')=>`<div class="notice error" role="alert"><p>${msg}</p>${btn('다시 시도','retry')}</div>`;
const status=i=>i.status==='planned'&&i.date<'2026-10-04'?'기록 없음':({planned:'예정',running:'진행 중',paused:'일시 정지',completed:'완료',skipped:'이번 주 건너뜀'}[i.status]);
function row(i,mode='today'){let r=routine(i);let done=i.status==='completed';return `<div class="row ${done?'done':''}">${done?`<span class="check">${icon('check')}</span>`:''}<div class="row-info"><div class="row-title">${e(r.name)}</div><p class="caption">${done?actual(i):`${i.time||'시간 미지정'} · ${duration(r)}${i.status==='paused'?' · 일시 정지':''}`}${mode==='week'?` · ${status(i)}`:''}</p>${i.moved&&done?'<p class="meta">날짜를 옮겨 마침</p>':''}</div>${done?btn('수정','completion','action',`data-id="${i.id}"`):i.status==='skipped'?btn('되돌리기','unskip','action',`data-id="${i.id}"`):btn(mode==='week'?'옮기기':i.status==='paused'?'이어서':'시작',mode==='week'?'reschedule':'start','action',`data-id="${i.id}"`)}</div>`}
function sunday(){return `<section class="sunday"><p class="meta">일요일의 작은 정리</p><h3 style="margin-top:8px">다음 주는 어떻게 보낼까요?</h3><p class="caption">10월 5일 월요일부터 11일 일요일까지</p>${btn('다음 주 계획하기 '+icon('right'),'nextplan')}</section>`}
function activePanel(i){return `<section class="active"><div class="active-head"><p class="caption">${status(i)}</p>${btn('실행 화면','running','quiet',`data-id="${i.id}"`)}</div><h2>${e(routine(i).name)}</h2><p class="secondary">${e(routine(i).first)}</p><div class="timer-small" data-timer="${i.id}" aria-label="기록 시간">${timer(elapsed(i))}</div><div class="actions">${btn(i.status==='paused'?'이어서 하기':'일시 정지',i.status==='paused'?'resume':'pause','outline',`data-id="${i.id}"`)}${btn('완료','finish','primary',`data-id="${i.id}"`)}</div></section>`}
function today(){let items=data.items.filter(i=>i.date==='2026-10-04');let a=data.items.find(i=>i.status==='running')||data.items.find(i=>i.status==='paused');let planned=items.filter(i=>i.status==='planned'||(i.status==='paused'&&i.id!==a?.id));let done=items.filter(i=>i.status==='completed');let h=heading('오늘','10월 4일 일요일');if(scenario==='empty')return h+empty('오늘은 정해둔 일이 없어요.','필요하면 이번 주 계획에서 추가할 수 있어요.',btn('이번 주 보기','week','outline'))+sunday();if(scenario==='error')h+=errorNotice('오늘 계획을 불러오지 못했어요.');if(a)h+=activePanel(a);else if(planned.length){let i=planned.shift(),r=routine(i);h+=`<section class="feature"><p class="meta">지금 해볼 일 · ${i.time||'시간 미지정'}</p><h2>${e(r.name)}</h2><p class="secondary">${e(r.first)}</p><p class="caption" style="margin-top:12px">${e(r.category)} · ${duration(r)}</p>${btn('시작하기','start','primary',`data-id="${i.id}"`)}<div class="feature-foot">${btn('이미 했어요','direct','subtle',`data-id="${i.id}"`)}${btn('다른 날로 옮기기','reschedule','subtle',`data-id="${i.id}"`)}</div></section>`}if(planned.length)h+=`<section class="section"><div class="section-heading"><h3>오늘 정한 일</h3><span class="caption">${planned.length}개</span></div>${planned.map(i=>row(i)).join('')}</section>`;if(!a&&!planned.length&&!items.some(i=>i.status==='planned'))h+=`<section class="section"><h3>오늘은 여기까지</h3><p class="secondary" style="margin-top:8px">필요하면 계획을 더해도 좋아요.</p></section>`;if(done.length)h+=`<section class="section"><h3>해낸 일</h3>${done.map(i=>row(i)).join('')}</section>`;return h+sunday()}
function dayStrip(action='day',selected=selectedDay){return `<div class="days" aria-label="월요일부터 일요일 날짜 선택">${weekDates().map((d,i)=>`<button data-action="${action}" data-day="${i}" class="${i===selected?'selected':''}" aria-pressed="${i===selected}" aria-label="${dateLabel(d)}${d==='2026-10-04'?', 오늘':''}"><span class="weekday">${'월화수목금토일'[i]}</span><span class="date">${dt(d).getDate()}</span><span class="daydot ${data.items.some(x=>x.date===d)?'':'blank'}"></span></button>`).join('')}</div>`}
function week(){let ds=weekDates(),d=ds[selectedDay],items=scenario==='empty'?[]:data.items.filter(i=>i.date===d),remaining=items.filter(i=>!['completed','skipped'].includes(i.status));let sum=remaining.reduce((a,i)=>a+(routine(i).duration||0),0);let h=heading(weekOffset===0?'이번 주':weekOffset===1?'다음 주':weekOffset<0?'지난 주':'주간 계획','월요일부터 일요일까지',btn(icon('plus'),'plan','icon-button','aria-label="주간 계획에 루틴 추가"'));h+=`<div class="week-title">${btn(icon('left'),'prevweek','icon-button','aria-label="이전 주"')}<div><h3>${rangeLabel()}</h3><p class="meta">2026년${weekOffset===1?' · 계획할 주':''}</p></div>${btn(icon('right'),'nextweek','icon-button','aria-label="다음 주"')}</div>${dayStrip()}<div class="dayheading"><h3>${dateLabel(d).replace('2026년 ','')}</h3><span class="caption">${remaining.length?`남은 예상 ${sum}분${remaining.some(i=>!routine(i).duration)?' · 미정 포함':''}`:'정해둔 시간 없음'}</span></div>`;if(scenario==='error')h+=errorNotice('계획 변경을 저장하지 못했어요.');h+=items.length?items.map(i=>row(i,'week')).join(''):empty(scenario==='empty'||!data.items.some(x=>ds.includes(x.date))?'이번 주에 할 일을 골라볼까요?':'이 날은 비워두었어요.','하고 싶은 일이 있다면 가볍게 더해보세요.',btn('루틴 선택','plan','outline'));h+=`<section class="section"><div class="stack">${btn('이번 주에 루틴 더하기','plan','outline full')}${btn('Apple Calendar에 반영','calendar','quiet full')}</div><p class="caption" style="margin-top:8px;text-align:center">${data.calendarState==='applied'?'앱 계획을 캘린더에 반영했어요.':'선택한 주의 계획만 캘린더에 표시해요.'}</p></section>`;return h}
function placeholder(){return heading(screens.find(s=>s[0]===screen)[1])+empty('디자인을 준비하고 있어요.','오늘과 이번 주 화면부터 검토할 수 있어요.',btn('오늘 보기','today','outline'))}
function render(){const phone=document.getElementById('phone');Object.entries(TOKENS.color[dark?'dark':'light']).forEach(([k,v])=>phone.style.setProperty('--'+k,v));Object.entries(TOKENS.typography).forEach(([k,v])=>{phone.style.setProperty('--type-'+k+'-size',v.size+'px');phone.style.setProperty('--type-'+k+'-line',v.lineHeight+'px');phone.style.setProperty('--type-'+k+'-weight',{regular:400,medium:500,semibold:600}[v.weight])});Object.entries(TOKENS.spacing).forEach(([k,v])=>phone.style.setProperty('--space-'+k,v+'px'));Object.entries(TOKENS.radius).forEach(([k,v])=>phone.style.setProperty('--radius-'+k,v+'px'));phone.style.setProperty('--motion-standard',TOKENS.motion.standard+'ms');phone.style.setProperty('--motion-easing',TOKENS.motion.easing);phone.classList.toggle('big',big);document.getElementById('screenNav').innerHTML=screens.map(([id,n],i)=>`<button data-action="nav" data-screen="${id}" aria-current="${screen===id}"><span style="font-variant-numeric:tabular-nums;margin-right:12px;color:#687168">0${i+1}</span>${n}</button>`).join('');document.getElementById('viewTitle').textContent=`0${screens.findIndex(s=>s[0]===screen)+1} / ${screens.find(s=>s[0]===screen)[1]}`;document.getElementById('content').innerHTML=({today,week,library:typeof library==='function'?library:placeholder,records:typeof records==='function'?records:placeholder,settings:typeof settings==='function'?settings:placeholder,editor:typeof editor==='function'?editor:placeholder,reschedule:typeof reschedule==='function'?reschedule:placeholder,running:typeof running==='function'?running:placeholder}[screen])();document.getElementById('tabs').style.display=['editor','reschedule'].includes(screen)?'none':'grid';document.getElementById('tabs').innerHTML=screens.slice(0,5).map(([id,n])=>`<button data-action="nav" data-screen="${id}" aria-current="${(screen==='running'?'today':screen)===id}">${icon(id)}<span>${n}</span></button>`).join('');document.getElementById('overlay').innerHTML=sheet?`<div class="sheet-backdrop"><section class="sheet fade" role="dialog" aria-modal="true" aria-label="${({plan:'주간 계획 선택',completion:'실행 기록',calendar:'Apple Calendar에 계획 반영',skip:'이번 주 건너뛰기',switchrun:'실행 전환',archiveview:'보관한 루틴'})[sheet]||'상세'}"><div class="grabber" aria-hidden="true"></div>${sheetView()}</section></div>`:'';document.getElementById('reviewStates').innerHTML=sheet==='calendar'?`<label for="calendarReview">캘린더 검토 상태</label><select id="calendarReview"><option value="ready">반영 전</option><option value="denied">권한 미허용</option><option value="partial">일부 반영 실패</option><option value="conflict">외부 변경 확인</option><option value="applied">반영 완료</option></select>`:'';if(sheet==='calendar')document.getElementById('calendarReview').value=draft.calendarState||data.calendarState;document.getElementById('content').inert=!!sheet;document.getElementById('tabs').inert=!!sheet;const strip=document.querySelector('.days');const day=strip?.querySelector('.selected');if(strip&&day){const left=day.getBoundingClientRect().left-strip.getBoundingClientRect().left+strip.scrollLeft;const right=left+day.getBoundingClientRect().width;if(left<strip.scrollLeft)strip.scrollLeft=left;else if(right>strip.scrollLeft+strip.clientWidth)strip.scrollLeft=right-strip.clientWidth}}

function completionSheet(){let i=data.items.find(x=>x.id===selectedId);if(!i)return '';return `<div class="sheet-header">${btn('닫기','close','subtle')}<strong>실행 기록</strong>${btn('저장','savecompletion')}</div><p class="caption">완료한 일</p><h2 style="margin-top:8px">${e(routine(i).name)}</h2><p class="secondary" style="margin-top:12px">${actual(i)}</p><label class="field"><span class="caption">실제 실행 시간 · 선택</span><input id="actualMinutes" type="number" min="0" max="10080" value="${i.actual==null?'':Math.floor(i.actual/60)}" placeholder="시간 미기록 · 분 단위"></label><p class="caption" style="margin-top:12px">비워두면 시간 미기록으로 남겨요.<br>예상 시간은 기록 시간으로 더하지 않습니다.</p><div id="completionError"></div><section class="section">${btn('완료 취소','undocomplete','subtle full',`data-id="${i.id}"`)}</section>`}
function calendarSheet(){let state=draft.calendarState||data.calendarState;let title=state==='applied'?'계획을 반영했어요':state==='conflict'?'캘린더에서 달라진 일정이 있어요':state==='partial'?'일부 일정을 반영하지 못했어요':'캘린더에 계획 표시';return `<div class="sheet-header">${btn('닫기','close','subtle')}<strong>Apple Calendar</strong><span style="width:44px"></span></div><h2>${title}</h2><p class="secondary" style="margin-top:12px">${rangeLabel()} · 앱에서 캘린더로</p><label class="field"><span class="caption">대상 캘린더</span><select id="calendarChoice"><option>한 주 · 나의 iPhone</option></select></label><section class="section"><p class="secondary">시간을 정한 일은 예상 시간만큼,<br>요일만 정한 일은 종일 일정으로 표시해요.</p><p class="caption" style="margin-top:12px">완료한 일의 계획 일정은 남겨요. 건너뛴 일은 제거해요. 메모와 실제 기록 시간은 보내지 않아요.</p></section>${state==='unlinked'?`<div class="notice"><p class="secondary">캘린더 접근 권한이 필요해요.</p><p class="caption" style="margin-top:8px">앱이 만든 일정을 확인하고 수정하기 위해 전체 접근을 요청합니다.</p></div>${btn('캘린더 연결하기','calendarallow','primary full')}`:state==='denied'?`<div class="notice"><p>캘린더 접근이 허용되지 않았어요.</p><p class="caption">연결 없이도 계획과 실행을 사용할 수 있어요.</p></div>${btn('시스템 설정 열기','systemsettings','outline full')}`:state==='conflict'?`<div class="notice"><p class="secondary">‘책상 정리’의 시각이 캘린더에서 변경되었어요. 앱 계획은 그대로예요.</p></div>${btn('앱 계획으로 다시 반영','calendarapply','primary full')}${btn('나중에 결정','close','subtle full')}`:state==='partial'?`<div class="notice"><p class="secondary">연결된 일정 1개의 변경을 완료하지 못했어요. 앱 계획은 저장되어 있어요.</p></div>${btn('실패한 항목 다시 반영','calendarapply','primary full')}`:state==='applied'?`<section class="section"><p class="secondary" style="color:var(--calendar)">같은 실행 항목은 중복으로 만들지 않아요.</p>${btn('다시 반영','calendarapply','outline full')}</section>`:`<section class="section">${btn('이 주의 계획 반영','calendarapply','primary full')}</section>`}`}
function sheetView(){if(sheet==='plan')return planningSheet();if(sheet==='completion')return completionSheet();if(sheet==='calendar')return calendarSheet();if(sheet==='skip')return `<div class="sheet-header">${btn('취소','close','subtle')}</div><h2>이번 주에서는 건너뛸까요?</h2><p class="secondary" style="margin:16px 0 24px">완료한 일로 세지 않아요.<br>남겨둔 실행 기록은 유지합니다.</p>${btn('건너뛰기','skip','outline full')}`;if(sheet==='switchrun')return `<div class="sheet-header">${btn('취소','close','subtle')}</div><h2>하던 일을 잠시 멈출까요?</h2><p class="secondary" style="margin:16px 0 24px">기록한 시간은 남겨두고 새 루틴을 시작해요.</p>${btn('멈추고 시작하기','switchstart','primary full')}`;if(sheet==='archiveview')return `<div class="sheet-header">${btn('닫기','close','subtle')}<strong>보관한 루틴</strong></div>${data.routines.filter(r=>r.archived).map(r=>`<div class="row"><p class="row-info">${e(r.name)}</p>${btn('복원','restore','action',`data-id="${r.id}"`)}</div>`).join('')}`;return ''}
function restoreSheetFocus(){if(!sheetReturn)return;const selector='[data-action="'+sheetReturn.action+'"]'+(sheetReturn.id?'[data-id="'+sheetReturn.id+'"]':'');document.querySelector(selector)?.focus()}
function openSheet(type){if(!sheet){const active=document.activeElement;if(active?.dataset?.action)sheetReturn={action:active.dataset.action,id:active.dataset.id}}sheet=type;render();setTimeout(()=>document.querySelector('.sheet button')?.focus(),20)}
function pauseItem(i){i.elapsed=elapsed(i);i.started=null;i.status='paused'}
function startItem(i){let active=data.items.find(x=>x.status==='running'&&x.id!==i.id);if(active){draft.startId=i.id;openSheet('switchrun');return}i.status='running';i.started=Date.now();i.elapsed=i.elapsed||0;selectedId=i.id;save();go('running')}
function handleAction(a,id,b){let i=data.items.find(x=>x.id===(id||selectedId));if(a==='start'){startItem(i);return}if(a==='switchstart'){data.items.filter(x=>x.status==='running').forEach(pauseItem);startItem(data.items.find(x=>x.id===draft.startId));return}if(a==='pause'){pauseItem(i);save();render();return}if(a==='resume'){startItem(i);return}if(a==='running'){selectedId=id;go('running');return}if(a==='finish'){i.actual=elapsed(i);i.elapsed=i.actual;i.started=null;i.status='completed';save();go('today');toast('해낸 일에 기록했어요.');return}if(a==='direct'){i.actual=null;i.status='completed';i.started=null;selectedId=i.id;save();render();toast(`완료했어요 · 시간 미기록 ${btn('시간 추가','completion','quiet',`data-id="${i.id}"`)}`);return}if(a==='completion'){selectedId=id||selectedId;openSheet('completion');return}if(a==='savecompletion'){let value=document.getElementById('actualMinutes').value;if(value!==''&&(!Number.isFinite(+value)||+value<0||+value>10080)){document.getElementById('completionError').innerHTML='<p class="secondary" style="color:var(--destructive)">0분부터 10,080분 사이로 입력해 주세요.</p>';return}i.actual=value===''?null:(i.actual!=null&&+value===Math.floor(i.actual/60)?i.actual:Math.round(+value*60));save();sheet=null;render();toast('실행 기록을 저장했어요.');return}if(a==='undocomplete'){i.status=(i.elapsed||0)>0?'paused':'planned';i.actual=null;i.started=null;save();sheet=null;render();toast('완료 표시를 취소했어요.');return}if(a==='reschedule'){selectedId=id;draft.moveDate=i.date;draft.moveTime=i.time;go('reschedule');return}if(a==='reschedulecancel'){const origin=rescheduleReturn;draft.moveDate=null;draft.moveTime=null;rescheduleReturn=null;go(origin?.screen||'today');document.getElementById('content').scrollTop=origin?.scrollTop||0;const trigger=[...document.querySelectorAll('[data-action]')].find(el=>el.dataset.action===origin?.action&&el.dataset.id===origin?.id);trigger?.focus({preventScroll:true});return}if(a==='cleartime'){document.getElementById('moveTime').value='';draft.moveTime='';return}if(a==='savemove'){let date=document.getElementById('moveDate').value,time=document.getElementById('moveTime').value;if(!date){toast('옮길 날짜를 선택해 주세요.');return}if(scenario==='error'){toast('선택한 날짜를 유지했어요. 다시 시도해 주세요.');return}if(i.status==='running')pauseItem(i);i.date=date;i.time=time;i.moved=true;data.calendarState=data.calendarState==='applied'?'ready':data.calendarState;save();let diff=Math.round((dt(date)-dt('2026-09-28'))/86400000);weekOffset=Math.floor(diff/7);selectedDay=((diff%7)+7)%7;go('week');toast(`${dateLabel(date)}로 옮겼어요.`);return}if(a==='skipconfirm'){openSheet('skip');return}if(a==='skip'){if(i.status==='running')pauseItem(i);i.status='skipped';save();go('week');toast('이번 주에서 건너뛰었어요. 완료 횟수에는 더하지 않아요.');return}if(a==='unskip'){i.status=(i.elapsed||0)>0?'paused':'planned';save();render();toast('계획에 다시 두었어요.');return}if(a==='filter'){filter=b.dataset.filter;render();return}if(a==='newroutine'){editorId=null;draft.editor=null;go('editor');return}if(a==='editroutine'){editorId=id;draft.editor=null;go('editor');return}if(a==='editorcancel'){draft.editor=null;go('library');return}if(a==='saveeditor'){let name=document.getElementById('routineName').value.trim(),dur=document.getElementById('routineDuration').value,count=+document.getElementById('routineCount').value;let error=!name?'루틴 이름을 적어 주세요.':dur&&(+dur<1||+dur>1440)?'예상 시간은 1분부터 1,440분까지 입력해 주세요.':count<1||count>14?'기본 횟수는 1회부터 14회까지 선택해 주세요.':scenario==='error'?'저장하지 못했어요. 입력한 내용은 유지했어요.':'';if(error){document.getElementById('editorError').innerHTML=`<p class="secondary" role="alert" style="color:var(--destructive);margin-top:12px">${error}</p>`;return}let values={name,category:document.getElementById('routineCategory').value,duration:dur?+dur:null,count,first:document.getElementById('routineFirst').value,memo:document.getElementById('routineMemo').value};if(editorId){data.items.filter(x=>x.rid===editorId&&!x.snapshot).forEach(x=>x.snapshot={...routine(x)});Object.assign(data.routines.find(r=>r.id===editorId),values)}else data.routines.push({id:'r'+Date.now(),...values});save();go('library');toast('루틴을 저장했어요.');return}if(a==='archive'){data.routines.find(r=>r.id===id).archived=true;save();go('library');toast('보관했어요. 이전 기록은 남아 있어요.');return}if(a==='archiveview'){openSheet('archiveview');return}if(a==='restore'){data.routines.find(r=>r.id===id).archived=false;save();sheet=null;render();return}if(a==='plan'){draft.selection={};openSheet('plan');return}if(a==='pickroutine'){let s=selectedDraft();if(s[id])delete s[id];else s[id]=Array.from({length:data.routines.find(r=>r.id===id).count||1},(_,j)=>(j*2)%7);render();return}if(a==='countplus'||a==='countminus'){let ar=selectedDraft()[id];if(a==='countplus'&&ar.length<14)ar.push((ar.length*2)%7);if(a==='countminus'&&ar.length>1)ar.pop();render();return}if(a==='copyplan'){let previous=weekDates().map(s=>{let d=dt(s);d.setDate(d.getDate()-7);return iso(d)}),s={};data.items.filter(x=>previous.includes(x.date)).forEach(x=>{if(!data.routines.find(r=>r.id===x.rid&&!r.archived))return;(s[x.rid]||(s[x.rid]=[])).push(previous.indexOf(x.date))});draft.selection=s;render();toast('지난 계획을 후보로 가져왔어요. 필요한 일만 남겨주세요.');return}if(a==='commitplan'){let s=selectedDraft();if(!Object.keys(s).length){toast('루틴을 고르거나 이번 주 쉬기를 선택해 주세요.');return}if(scenario==='error'){toast('계획을 저장하지 못했어요. 선택 내용은 남아 있어요.');return}let seq=Date.now(),ds=weekDates();for(let [rid,days] of Object.entries(s))for(let day of days)data.items.push({id:'o'+seq++,rid,snapshot:{...data.routines.find(r=>r.id===rid)},date:ds[day],time:'',status:'planned',elapsed:0});selectedDay=Math.min(...Object.values(s).flat());save();sheet=null;render();toast('고른 일을 이번 주 계획에 담았어요.');return}if(a==='restweek'){sheet=null;render();toast('이번 주에는 계획을 더하지 않았어요. 필요하면 언제든 추가해요.');return}if(a==='setting'){let key=b.dataset.key;data.settings[key]=!data.settings[key];save();render();toast('예시 설정을 저장했어요. 실제 알림은 예약하지 않아요.');return}if(a==='systemsettings'){toast('네이티브 앱에서 iOS 설정을 여는 위치입니다.');return}if(a==='calendar'){draft.calendarState=scenario==='error'?'partial':data.calendarState;openSheet('calendar');return}if(a==='calendarallow'){draft.calendarState='ready';render();return}if(a==='calendardenied'||a==='calendarconflict'||a==='calendarpartial'){draft.calendarState={calendardenied:'denied',calendarconflict:'conflict',calendarpartial:'partial'}[a];render();return}if(a==='calendarapply'){data.calendarState='applied';draft.calendarState='applied';save();render();toast('반영 완료 예시입니다. 실제 캘린더는 바뀌지 않아요.');return}}
document.addEventListener('change',ev=>{let el=ev.target;if(el.id==='calendarReview'){draft.calendarState=el.value;render();return}if(el.dataset.assign){selectedDraft()[el.dataset.assign][+el.dataset.index]=+el.value}if(el.id==='moveDate')draft.moveDate=el.value;if(el.id==='moveTime')draft.moveTime=el.value;if(el.id==='defaultTime'||el.id==='planTime'){data.settings[el.id==='defaultTime'?'executeTime':'planTime']=el.value;save();toast('예시 알림 시간을 저장했어요.')}});
document.addEventListener('input',ev=>{if(ev.target.id.startsWith('routine')){draft.editor={id:editorId,name:document.getElementById('routineName').value,category:document.getElementById('routineCategory').value,duration:document.getElementById('routineDuration').value,count:document.getElementById('routineCount').value,first:document.getElementById('routineFirst').value,memo:document.getElementById('routineMemo').value}}if(ev.target.id==='weekMemo'){(data.memos||(data.memos={}))[weekKey()]=ev.target.value;document.getElementById('memoStatus').textContent=scenario==='error'?'저장되지 않음':'저장 중…';clearTimeout(memoTimer);memoTimer=setTimeout(()=>{if(scenario!=='error'){save();if(document.getElementById('memoStatus'))document.getElementById('memoStatus').textContent='저장됨'}},500)}});
document.addEventListener('keydown',ev=>{if(!sheet)return;if(ev.key==='Escape'){sheet=null;render();restoreSheetFocus()}if(ev.key==='Tab'){let controls=[...document.querySelectorAll('.sheet button,.sheet input,.sheet textarea,.sheet select')].filter(el=>!el.disabled);if(!controls.length)return;let first=controls[0],last=controls[controls.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}}});

render();
</script></body></html>
