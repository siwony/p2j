name: iOS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ios-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ github.event_name == 'pull_request' && 'iOS build and tests' || 'iOS full regression' }}
    runs-on: macos-15
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test selection rules
        run: node --test .github/scripts/ios-test-plan.test.cjs
      - name: Record checkout SHA
        run: echo "CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Select affected tests
        id: plan
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: await require('./.github/scripts/ios-test-plan.cjs').run({ context, core });
      - name: Select iPhone 15 Pro simulator
        if: steps.plan.outputs.native == 'true'
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import json, os, subprocess
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '--json']))['runtimes']
          ios = [r for r in runtimes if r['isAvailable'] and '.iOS-' in r['identifier']]
          runtime = max(ios, key=lambda r: tuple(map(int, r['version'].split('.'))))
          simulator = subprocess.check_output(['xcrun', 'simctl', 'create', 'Hanju CI', 'com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro', runtime['identifier']], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'SIMULATOR_ID={simulator}\n')
          print(f"iPhone 15 Pro / iOS {runtime['version']}")
          PY
      - name: Build and test
        id: xcode
        if: steps.plan.outputs.native == 'true'
        run: node .github/scripts/ios-test-plan.cjs execute build/ios-test-plan.json
      - name: Verify selected suites actually ran
        id: suites
        if: always() && steps.plan.outputs.native == 'true'
        run: node .github/scripts/ios-test-plan.cjs verify build/ios-test-plan.json
      - name: Native validation not required
        if: steps.plan.outputs.native == 'false'
        run: echo 'Documentation/Graphify/tooling-only changes; native build not needed.'
      - name: Record native outcomes
        if: always() && steps.plan.outputs.native == 'true'
        env:
          BUILD_OUTCOME: ${{ steps.xcode.outcome }}
          SUITE_OUTCOME: ${{ steps.suites.outcome }}
        run: |
          printf '\nBuild/test outcome: %s\n\nSelected-suite verification: %s\n' "$BUILD_OUTCOME" "$SUITE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
      - name: Save test results and selection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results
          path: |
            build/TestResults.xcresult
            build/ios-test-plan.json
            build/executed-tests.json
          if-no-files-found: ignore
          retention-days: 7
